# Nightly long-running suites (spec 13): ZEXDOC and ZEXALL (~80 s each in Release). Free tier only (D-016):
# one windows-latest Release job on the default branch; it reuses the CI workflow's vcpkg binary cache.
name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with "builtin-baseline" in vcpkg.json and ci.yml.
  VCPKG_COMMIT: 0c2a9ace1964b818b15f7ae50ba1c42404918a7b

jobs:
  zex:
    name: ZEXDOC / ZEXALL
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Fetch and bootstrap vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "$env:RUNNER_TEMP\vcpkg"
          $env:VCPKG_BINARY_CACHE = "$env:RUNNER_TEMP\vcpkg-binary-cache"
          "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          "VCPKG_BINARY_CACHE=$env:VCPKG_BINARY_CACHE" >> $env:GITHUB_ENV
          git init -q "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" fetch -q --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_COMMIT
          git -C "$env:VCPKG_ROOT" checkout -q FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_BINARY_CACHE" | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_BINARY_CACHE,read" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-x64-windows-static-md-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-md-${{ env.VCPKG_COMMIT }}-

      - name: Configure
        run: cmake --preset win-release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build --preset win-release --target gen_z80_zex -- /m /v:minimal

      - name: Fetch ZEXDOC / ZEXALL
        run: python tools/fetch-test-data.py --only zex

      - name: Run ZEXDOC / ZEXALL
        run: ctest --test-dir build/win-release -C Release -L z80-zex --output-on-failure
