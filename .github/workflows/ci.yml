# Windows CI on the GitHub Actions free tier (D-016): standard windows-latest runners, the standard
# Actions cache and default artifact retention only. macOS is validated locally (tools/validate-mac.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with "builtin-baseline" in vcpkg.json.
  VCPKG_COMMIT: 0c2a9ace1964b818b15f7ae50ba1c42404918a7b
  CLANG_FORMAT_VERSION: 22.1.8

jobs:
  format:
    name: clang-format
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install clang-format
        run: python -m pip install --disable-pip-version-check clang-format==${{ env.CLANG_FORMAT_VERSION }}
      - name: Check formatting
        run: python tools/format.py --check

  build:
    name: build (${{ matrix.config }})
    needs: format
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\..\vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v5

      - name: Fetch and bootstrap vcpkg
        shell: pwsh
        run: |
          git init -q "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" fetch -q --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_COMMIT
          git -C "$env:VCPKG_ROOT" checkout -q FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_BINARY_CACHE" | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_BINARY_CACHE,readwrite" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-x64-windows-static-md-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-md-${{ env.VCPKG_COMMIT }}-

      - name: Configure
        run: cmake --preset win-${{ matrix.config }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true  # the other matrix job may have saved the same key first
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-x64-windows-static-md-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build --preset win-${{ matrix.config }} -- /m /v:minimal

      - name: Test
        run: ctest --preset win-${{ matrix.config }}

      - name: Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.config == 'release'
        run: cmake --install build/win-release --config Release --prefix dist/genesisEmu

      - name: Upload Windows build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.config == 'release'
        uses: actions/upload-artifact@v5
        with:
          name: genesisEmu-windows-x64-${{ github.sha }}
          path: dist/genesisEmu
